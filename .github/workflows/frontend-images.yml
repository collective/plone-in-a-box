name: Frontend images

# Builds the ready-made frontend images listed in addons.yml (the entries with
# packages) from frontend-image/Dockerfile, and publishes them to ghcr.io/<owner>/plone-in-a-box-frontend: the real images
# from collective/plone-in-a-box, test images from forks. Pull requests only
# build. A failed build publishes nothing, so the previous image stays.
# Afterwards, old builds are deleted (scripts/cleanup-images.py): each
# image keeps its newest 26 builds, and test images go after 7 days.

on:
  push:
    branches: [main]
    paths: [frontend-image/**, addons.yml, scripts/catalog.py, .github/workflows/frontend-images.yml]
  pull_request:
    paths: [frontend-image/**, addons.yml, scripts/catalog.py, .github/workflows/frontend-images.yml]
  schedule:
    # Weekly, to pick up Volto patch releases in the builder image.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      cleanup_dry_run:
        description: "Only report which old builds the cleanup would delete"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: The images in addons.yml
        id: list
        run: echo "matrix=$(python3 scripts/catalog.py matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: images
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.images.outputs.matrix) }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/plone-in-a-box-frontend
      TAG: ${{ matrix.volto }}-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
      - name: Tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:$TAG"
            echo "$IMAGE:$TAG-$(date -u +%Y-%m-%d)"
            echo "$IMAGE:$TAG-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: frontend-image
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VOLTO_VERSION=${{ matrix.volto }}
            PACKAGES=${{ matrix.packages }}
            ADDONS=${{ matrix.addons }}
            THEME=${{ matrix.theme }}
            BACKEND_ADDONS=${{ matrix.backend_addons }}
            SITE_BEHAVIORS=${{ matrix.site_behaviors }}
            DEMO_ROLES=${{ matrix.demo_roles }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Plone in a Box frontend: plone/plone-frontend ${{ matrix.volto }} with ${{ matrix.description }}

  cleanup:
    needs: build
    # After the builds, even if one failed; never for pull requests.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Delete old builds
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.cleanup_dry_run }}
        run: python3 scripts/cleanup-images.py
