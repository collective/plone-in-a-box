name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck src/StackScript src/user-data.sh src/add-updates.sh scripts/test-deploy.sh scripts/test-notify.sh scripts/linode-obsolete-stackscript.sh scripts/linode-addon-stackscript.sh scripts/update-public-stackscripts.sh
      # The scripts setup writes to the server (plone-update, notify, ...) are
      # text inside src/StackScript, so the checks above don't parse them.
      - name: The scripts inside src/StackScript parse
        run: |
          mkdir -p embedded
          awk -v q="'" '
            !inside && match($0, "<<" q "[A-Za-z_]+" q "$") { delim = substr($0, RSTART + 3, RLENGTH - 4); start = NR; body = ""; first = ""; inside = 1; next }
            inside && $0 == delim { if (first ~ /^#!\/bin\/(ba)?sh/) { f = "embedded/line-" start ".sh"; printf "%s", body > f; close(f) } inside = 0; next }
            inside { if (body == "") first = $0; body = body $0 "\n" }
          ' src/StackScript
          ls embedded
          test "$(ls embedded | wc -l)" -ge 3
          for f in embedded/*.sh; do bash -n "$f"; done
      - name: Launchers download the same release
        run: |
          release=$(sed -n "s/^PIAB_RELEASE='\(.*\)'$/\1/p" src/user-data.sh)
          template=$(grep -A3 '^  Release:' src/aws/cloudformation.yaml | sed -n 's/.*Default: "\(.*\)"/\1/p')
          add_updates=$(sed -n "s/^  local PIAB_RELEASE='\(.*\)'$/\1/p" src/add-updates.sh)
          terraform_aws=$(grep -A3 '^variable "release"' src/aws/main.tf | sed -n 's/.*default *= *"\(.*\)"/\1/p')
          terraform_hetzner=$(grep -A3 '^variable "release"' src/hetzner/main.tf | sed -n 's/.*default *= *"\(.*\)"/\1/p')
          echo "src/user-data.sh: $release, src/aws/cloudformation.yaml: $template, src/add-updates.sh: $add_updates, src/aws/main.tf: $terraform_aws, src/hetzner/main.tf: $terraform_hetzner"
          test -n "$release" && test "$template" = "$release" && test "$add_updates" = "$release" && test "$terraform_aws" = "$release" && test "$terraform_hetzner" = "$release"
          bad=$(grep -HnoE 'plone-in-a-box/[A-Za-z0-9._-]*/src/(StackScript|add-updates\.sh)' README.md docs/setup-guide.md docs/try-it-buttons.md src/add-updates.sh \
            | grep -vE "plone-in-a-box/$release/src/(StackScript|add-updates\.sh)" || true)
          if [ -n "$bad" ]; then echo "Launchers in the docs download another release:"; echo "$bad"; exit 1; fi

      - name: The add-on catalog, and the Try It pages made from it
        run: python3 scripts/catalog.py check

      - name: The script fits in the Terraform user data
        run: |
          # src/digitalocean/main.tf embeds src/StackScript compressed, as base64, and
          # DigitalOcean allows 64 KiB; leave room for the settings. (AWS and Hetzner
          # download it instead.)
          size=$(gzip -9 < src/StackScript | base64 -w0 | wc -c)
          echo "DigitalOcean: $size of 60000 bytes"
          test "$size" -lt 60000

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, digitalocean, hetzner]
    defaults:
      run:
        working-directory: src/${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: terraform fmt
        run: terraform fmt -check -diff
      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate

  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: cfn-lint
        run: |
          pip install cfn-lint
          cfn-lint src/aws/cloudformation.yaml
