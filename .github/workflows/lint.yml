name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck src/StackScript src/user-data.sh scripts/test-deploy.sh
      - name: Launchers download the same release
        run: |
          release=$(sed -n "s/^PIAB_RELEASE='\(.*\)'$/\1/p" src/user-data.sh)
          template=$(grep -A3 '^  Release:' src/aws/cloudformation.yaml | sed -n 's/.*Default: "\(.*\)"/\1/p')
          echo "src/user-data.sh: $release, src/aws/cloudformation.yaml: $template"
          test -n "$release" && test "$template" = "$release"
          bad=$(grep -Hno 'plone-in-a-box/[^/ ]*/src/StackScript' README.md docs/setup-guide.md \
            | grep -v "plone-in-a-box/$release/src/StackScript" || true)
          if [ -n "$bad" ]; then echo "Launchers in the docs download another release:"; echo "$bad"; exit 1; fi

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, digitalocean, hetzner]
    defaults:
      run:
        working-directory: src/${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -diff
      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate

  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cfn-lint
        run: |
          pip install cfn-lint
          cfn-lint src/aws/cloudformation.yaml
