AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Plone in a Box: one Ubuntu 26.04 LTS server running Plone 6 with the Volto front end
  and PostgreSQL behind nginx. Open the SiteURL output after creating the stack to
  watch setup progress (about 10 minutes). https://github.com/tkimnguyen/plone-in-a-box

# The "Launch Stack" button in the README opens this template from
# https://plone-in-a-box-templates.s3.us-east-1.amazonaws.com/latest/cloudformation.yaml
# (see RELEASING.md). Like src/user-data.sh, the server downloads src/StackScript
# from the Plone in a Box release named in the Release parameter.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Your Plone site
        Parameters:
          - AdminPassword
          - SiteTimezone
          - SiteLanguage
          - StarterContent
      - Label:
          default: Server
        Parameters:
          - InstanceType
          - VolumeSize
      - Label:
          default: HTTPS (optional)
        Parameters:
          - Domain
          - LetsEncryptEmail
      - Label:
          default: SSH access (optional)
        Parameters:
          - KeyName
          - SSHLocation
      - Label:
          default: Add-ons and themes (optional)
        Parameters:
          - Addons
          - FrontendImage
          - BackendImage
          - RegistryUser
          - RegistryToken
      - Label:
          default: Demo login (optional)
        Parameters:
          - DemoUser
          - DemoPassword
          - DemoRoles
      - Label:
          default: Updates
        Parameters:
          - AutoUpdate
          - NotifyUrl
      - Label:
          default: Email (optional)
        Parameters:
          - SmtpHost
          - SmtpPort
          - SmtpUser
          - SmtpPassword
          - EmailFrom
          - ReportEmail
          - SpamhausKey
      - Label:
          default: Logs and graphs (optional)
        Parameters:
          - LogServer
          - LogToken
          - LogRequests
          - MetricsEndpoint
          - MetricsUser
          - MetricsToken
      - Label:
          default: Advanced (leave as is)
        Parameters:
          - PloneVersion
          - VoltoVersion
          - Release
          - LatestAmiId
    ParameterLabels:
      AdminPassword:
        default: Plone admin password
      SiteTimezone:
        default: Site time zone
      SiteLanguage:
        default: Site language
      StarterContent:
        default: Starter content
      InstanceType:
        default: Server size
      VolumeSize:
        default: Disk size (GB)
      Domain:
        default: Domain name
      LetsEncryptEmail:
        default: Email for Let's Encrypt
      KeyName:
        default: SSH key pair
      SSHLocation:
        default: Allow SSH from
      Addons:
        default: Backend add-ons
      FrontendImage:
        default: Frontend image
      BackendImage:
        default: Backend image
      RegistryUser:
        default: Registry username
      RegistryToken:
        default: Registry token
      DemoUser:
        default: Demo login
      DemoPassword:
        default: Demo login password
      DemoRoles:
        default: Roles of the demo login
      AutoUpdate:
        default: Automatic updates
      NotifyUrl:
        default: Notification URL
      SmtpHost:
        default: SMTP server
      SmtpPort:
        default: SMTP port
      SmtpUser:
        default: SMTP username
      SmtpPassword:
        default: SMTP password
      EmailFrom:
        default: From address
      ReportEmail:
        default: Email for reports
      SpamhausKey:
        default: Spamhaus DQS key
      LogServer:
        default: Log server
      LogToken:
        default: Log token
      LogRequests:
        default: Log each web request
      MetricsEndpoint:
        default: OpenTelemetry endpoint
      MetricsUser:
        default: OpenTelemetry user
      MetricsToken:
        default: OpenTelemetry token
      PloneVersion:
        default: Plone backend image tag
      VoltoVersion:
        default: Volto frontend image tag
      Release:
        default: Plone in a Box release
      LatestAmiId:
        default: Ubuntu image

Parameters:
  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: >-
      Password for the "admin" user of your Plone site, at least 12 characters.
      Store it in a password manager.
  SiteTimezone:
    Type: String
    Default: UTC
    Description: Time zone for the Plone site, for example America/Chicago.
  SiteLanguage:
    Type: String
    Default: en
    AllowedPattern: '^[A-Za-z]{2,3}([-_][A-Za-z]{2,4})?$'
    ConstraintDescription: Must be a language code such as en, de, fr, es or pt-br.
    Description: The site's language, as a language code such as en, de, fr, es or pt-br.
  StarterContent:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >-
      yes starts the site with Plone's welcome page (or a Plone distribution's own sample content); no
      starts with an empty site.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
      - t3a.small
      - t3a.medium
      - t3a.large
    Description: >-
      t3.small (2 GB of memory) is the smallest size that runs Plone well. Larger sizes cost more.
  VolumeSize:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
    Description: Size of the server's disk in GB.
  Domain:
    Type: String
    Default: ""
    AllowedPattern: '^[A-Za-z0-9.-]*$'
    ConstraintDescription: Must be a domain name such as plone.example.org, or empty.
    Description: >-
      Optional. A domain name for the site, for example plone.example.org. For HTTPS, its DNS must
      already point at the server's address; otherwise leave this empty and add HTTPS later.
  LetsEncryptEmail:
    Type: String
    Default: ""
    Description: Required for HTTPS. Let's Encrypt sends certificate notices here.
  KeyName:
    Type: String
    Default: ""
    Description: >-
      Optional. The name of an existing EC2 key pair, if you want to log in over SSH from your own
      computer. Not needed for the site, or for EC2 Instance Connect in the browser.
  SSHLocation:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be an IPv4 address range such as 203.0.113.7/32.
    Description: >-
      Addresses allowed to connect over SSH (port 22). Keep 0.0.0.0/0 to use EC2 Instance Connect in
      the browser; use your own IP followed by /32 if you'll only use SSH from your computer.
  Addons:
    Type: String
    Default: ""
    AllowedPattern: '^[A-Za-z0-9 ._,\[\]~=!<>*+-]*$'
    ConstraintDescription: Must be Python package names separated by spaces.
    Description: >-
      Python package names separated by spaces, for example collective.easyform. Activate them
      afterwards in Site Setup > Add-ons.
  FrontendImage:
    Type: String
    Default: ""
    AllowedPattern: '^[A-Za-z0-9./:@_-]*$'
    ConstraintDescription: Must be a container image name, such as ghcr.io/collective/plone-in-a-box-frontend:19-vlt.
    Description: >-
      A ready-made Plone in a Box image such as ghcr.io/collective/plone-in-a-box-frontend:19-vlt
      (Volto Light Theme; its backend add-on is installed and activated too), or your own. Leave empty
      for the standard Volto image.
  BackendImage:
    Type: String
    Default: ""
    AllowedPattern: '^[A-Za-z0-9./:@_-]*$'
    ConstraintDescription: Must be a container image name, such as ghcr.io/kitconcept/kitconcept-intranet-backend:3.11.
    Description: >-
      Replaces the official Plone backend, for example a Plone distribution such as
      ghcr.io/kitconcept/kitconcept-intranet-backend:3.11 (with its frontend image above), or your own
      project's. Leave empty for the official Plone backend.
  RegistryUser:
    Type: String
    Default: ""
    AllowedPattern: '^[A-Za-z0-9._@-]*$'
    ConstraintDescription: Must be a username of letters, digits, dots, hyphens, underscores or @.
    Description: >-
      Only for private images: the username for the registry of the frontend and backend images,
      for example your GitHub username for ghcr.io. Leave empty for public images.
  RegistryToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: >-
      Only for private images: a read-only access token for that registry, such as a GitHub token
      with only read:packages.
  DemoUser:
    Type: String
    Default: ""
    AllowedPattern: '^([a-z][a-z0-9._-]{1,31})?$'
    ConstraintDescription: Must be a username of lowercase letters, digits, dots, hyphens and underscores, or empty.
    Description: >-
      A username such as demo, for people you let try the site. Setup creates it with a generated
      password, saved next to the admin password in /root/plone-credentials.txt. Leave empty for none.
  DemoPassword:
    Type: String
    Default: ""
    NoEcho: true
    AllowedPattern: '^(.{12,})?$'
    ConstraintDescription: Must be at least 12 characters, or empty.
    Description: >-
      Optional, at least 12 characters. Leave empty to have one generated and saved next to the admin
      password.
  DemoRoles:
    Type: String
    Default: ""
    AllowedPattern: '^[A-Za-z0-9 ,._-]*$'
    ConstraintDescription: Must be role names separated by commas, such as Editor, or empty.
    Description: >-
      Roles of the demo login, separated by commas, for example Editor or Site Administrator. Leave
      empty for the roles the frontend image suggests, or Site Administrator.
  AutoUpdate:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >-
      Install Plone, Volto and PostgreSQL patch releases every week, after a database backup, and undo
      them if the site doesn't come back. With "no", run sudo plone-update on the server yourself.
  NotifyUrl:
    Type: String
    Default: ""
    NoEcho: true
    AllowedPattern: '^(https://[^\s"]*)?$'
    ConstraintDescription: Must start with https://.
    Description: >-
      Optional. Update reports are posted here, for example https://ntfy.sh/a-long-random-topic for the ntfy
      phone app, or a Slack, Discord, Google Chat, Mattermost or Microsoft Teams webhook URL. Keep it private.
  SmtpHost:
    Type: String
    Default: ""
    AllowedPattern: '^[A-Za-z0-9.-]*$'
    ConstraintDescription: Must be a host name such as mail.smtp2go.com, or empty.
    Description: >-
      Optional. The SMTP server of an email relay service such as SMTP2GO, Brevo or Amazon SES, for
      password resets, forms and update reports. Leave empty if the site doesn't need to send email.
  SmtpPort:
    Type: Number
    Default: 587
    MinValue: 1
    MaxValue: 65535
    Description: 587 works with most services; try 2525 if 587 is blocked.
  SmtpUser:
    Type: String
    Default: ""
    Description: The SMTP username from your email service.
  SmtpPassword:
    Type: String
    Default: ""
    NoEcho: true
    Description: The SMTP password from your email service.
  EmailFrom:
    Type: String
    Default: ""
    AllowedPattern: '^([^@\s]+@[A-Za-z0-9.-]+)?$'
    ConstraintDescription: Must be an email address, or empty.
    Description: >-
      The site's From address, at a domain your email service has verified, for example
      plone@example.org.
  ReportEmail:
    Type: String
    Default: ""
    AllowedPattern: '^([^@\s]+@[A-Za-z0-9.-]+)?$'
    ConstraintDescription: Must be an email address, or empty.
    Description: >-
      Your address: setup sends a test email here, and the update reports go here too. Empty: the From
      address.
  SpamhausKey:
    Type: String
    Default: ""
    NoEcho: true
    AllowedPattern: '^[A-Za-z0-9]*$'
    ConstraintDescription: Letters and digits only.
    Description: >-
      Optional: a free Data Query Service key from spamhaus.com, so the blocklist checks can ask Spamhaus
      about the server's IP address and the site's domains.
  LogServer:
    Type: String
    Default: ""
    AllowedPattern: '^([A-Za-z0-9.-]+:[0-9]{1,5})?$'
    ConstraintDescription: Must be HOST:PORT, or empty.
    Description: >-
      Optional: a syslog server or service that gets the server's logs too, as HOST:PORT over TLS, for
      example s1234567.us-east-9.betterstackdata.com:6514. See "Sending the logs elsewhere" in the setup guide.
  LogToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: >-
      The token element your log service wants in each message, in brackets, as the service gives it. Empty
      if it needs none.
  LogRequests:
    Type: String
    Default: "no"
    AllowedValues: ["yes", "no"]
    Description: One line per web request too, which is most of the volume.
  MetricsEndpoint:
    Type: String
    Default: ""
    AllowedPattern: '^(https?://[^\s"]*)?$'
    ConstraintDescription: Must start with https://, or be empty.
    Description: >-
      Optional: an OpenTelemetry service's OTLP endpoint that gets the server's and the site's numbers, for
      example https://otlp-gateway-prod-us-east-2.grafana.net/otlp. See "Graphs of your server and site" in
      the setup guide.
  MetricsUser:
    Type: String
    Default: ""
    AllowedPattern: '^[A-Za-z0-9._@:-]*$'
    Description: >-
      Your instance ID or user (Grafana Cloud), or header:NAME for a service that takes the token in a
      header (header:api-key for New Relic).
  MetricsToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: The OpenTelemetry service's token.
  PloneVersion:
    Type: String
    Default: "6.2"
    AllowedPattern: '^[A-Za-z0-9._-]+$'
    Description: plone/plone-backend Docker image tag.
  VoltoVersion:
    Type: String
    Default: "19"
    AllowedPattern: '^[A-Za-z0-9._-]+$'
    Description: plone/plone-frontend Docker image tag.
  Release:
    Type: String
    Default: "2.26"
    AllowedPattern: '^[A-Za-z0-9._/-]+$'
    Description: The Plone in a Box release whose provisioning script the server downloads.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/26.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Latest Ubuntu 26.04 LTS image, looked up automatically.

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]
  HasDomain: !Not [!Equals [!Ref Domain, ""]]

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Plone in a Box: SSH, HTTP and HTTPS"
      SecurityGroupIngress:
        - Description: SSH
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
        - Description: HTTP
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: HTTP (IPv6)
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIpv6: ::/0
        - Description: HTTPS
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: HTTPS (IPv6)
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: ::/0
        # The control panel on a site without a domain name: nothing answers
        # until you turn it on (sudo plone-panel on).
        - Description: Plone in a Box control panel
          IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: 0.0.0.0/0
        - Description: Plone in a Box control panel (IPv6)
          IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIpv6: ::/0

  # The server is never deleted by accident: termination protection makes AWS
  # refuse to terminate it (deleting the stack, the EC2 console, anything else),
  # and a stack update that needs a new server (every update looks up the newest
  # Ubuntu image again) keeps the old one. To remove it on purpose, turn
  # termination protection off in the EC2 console first; see the setup guide.
  Instance:
    Type: AWS::EC2::Instance
    # Allocate the address first: if that fails (too many Elastic IPs in the
    # region, say), the stack rolls back before there's a protected server
    # that the rollback couldn't delete.
    DependsOn: ElasticIP
    UpdateReplacePolicy: Retain
    Metadata:
      cfn-lint:
        config:
          # Termination protection, not DeletionPolicy: Retain, stops deletion;
          # with Retain, deleting the stack on purpose would fail on the
          # security group the kept server still uses.
          ignore_checks: [W3011]
    Properties:
      DisableApiTermination: true
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !GetAtt SecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            Encrypted: true
      MetadataOptions:
        HttpTokens: required
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
      # The settings are passed base64-encoded, so any characters in them
      # survive the shell. Then, like src/user-data.sh, download the
      # provisioning script from the release and run it.
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -uo pipefail
            d() { echo "$1" | base64 -d; }
            ADMIN_PASSWORD="$(d '${AdminPasswordB64}')"
            DOMAIN="$(d '${DomainB64}')"
            LETSENCRYPT_EMAIL="$(d '${EmailB64}')"
            SITE_TIMEZONE="$(d '${TimezoneB64}')"
            SITE_LANGUAGE='${SiteLanguage}'
            STARTER_CONTENT='${StarterContent}'
            PLONE_VERSION='${PloneVersion}'
            VOLTO_VERSION='${VoltoVersion}'
            ADDONS="$(d '${AddonsB64}')"
            FRONTEND_IMAGE="$(d '${FrontendImageB64}')"
            BACKEND_IMAGE="$(d '${BackendImageB64}')"
            REGISTRY_USER="$(d '${RegistryUserB64}')"
            REGISTRY_TOKEN="$(d '${RegistryTokenB64}')"
            DEMO_USER='${DemoUser}'
            DEMO_PASSWORD="$(d '${DemoPasswordB64}')"
            DEMO_ROLES='${DemoRoles}'
            AUTO_UPDATE='${AutoUpdate}'
            NOTIFY_URL="$(d '${NotifyUrlB64}')"
            SMTP_HOST='${SmtpHost}'
            SMTP_PORT='${SmtpPort}'
            SMTP_USER="$(d '${SmtpUserB64}')"
            SMTP_PASSWORD="$(d '${SmtpPasswordB64}')"
            EMAIL_FROM="$(d '${EmailFromB64}')"
            REPORT_EMAIL="$(d '${ReportEmailB64}')"
            SPAMHAUS_KEY='${SpamhausKey}'
            LOG_SERVER='${LogServer}'
            LOG_TOKEN="$(d '${LogTokenB64}')"
            LOG_REQUESTS='${LogRequests}'
            METRICS_ENDPOINT="$(d '${MetricsEndpointB64}')"
            METRICS_USER='${MetricsUser}'
            METRICS_TOKEN="$(d '${MetricsTokenB64}')"
            export ADMIN_PASSWORD DOMAIN LETSENCRYPT_EMAIL SITE_TIMEZONE SITE_LANGUAGE STARTER_CONTENT PLONE_VERSION VOLTO_VERSION ADDONS FRONTEND_IMAGE BACKEND_IMAGE REGISTRY_USER REGISTRY_TOKEN DEMO_USER DEMO_PASSWORD DEMO_ROLES AUTO_UPDATE NOTIFY_URL
            export SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD EMAIL_FROM REPORT_EMAIL SPAMHAUS_KEY
            export LOG_SERVER LOG_TOKEN LOG_REQUESTS METRICS_ENDPOINT METRICS_USER METRICS_TOKEN
            SCRIPT_URL='https://raw.githubusercontent.com/tkimnguyen/plone-in-a-box/${Release}/src/StackScript'
            SCRIPT=$(mktemp)
            if ! curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors \
                --output "$SCRIPT" "$SCRIPT_URL"; then
              echo "[plone-in-a-box] Could not download $SCRIPT_URL" | tee -a /var/log/plone-in-a-box.log >&2
              exit 1
            fi
            exec bash "$SCRIPT"
          - AdminPasswordB64: !Base64 {Ref: AdminPassword}
            DomainB64: !Base64 {Ref: Domain}
            EmailB64: !Base64 {Ref: LetsEncryptEmail}
            TimezoneB64: !Base64 {Ref: SiteTimezone}
            AddonsB64: !Base64 {Ref: Addons}
            FrontendImageB64: !Base64 {Ref: FrontendImage}
            BackendImageB64: !Base64 {Ref: BackendImage}
            RegistryUserB64: !Base64 {Ref: RegistryUser}
            RegistryTokenB64: !Base64 {Ref: RegistryToken}
            NotifyUrlB64: !Base64 {Ref: NotifyUrl}
            DemoPasswordB64: !Base64 {Ref: DemoPassword}
            SmtpUserB64: !Base64 {Ref: SmtpUser}
            SmtpPasswordB64: !Base64 {Ref: SmtpPassword}
            EmailFromB64: !Base64 {Ref: EmailFrom}
            ReportEmailB64: !Base64 {Ref: ReportEmail}
            LogTokenB64: !Base64 {Ref: LogToken}
            MetricsEndpointB64: !Base64 {Ref: MetricsEndpoint}
            MetricsTokenB64: !Base64 {Ref: MetricsToken}

  # A fixed address, so the site keeps the same IP after the server is stopped
  # and started, and DNS for a domain only needs setting once. Deleting the stack
  # keeps it, so the site doesn't lose its address if the stack is deleted by
  # mistake; release it in EC2 > Elastic IPs when you no longer need it.
  ElasticIP:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  # Kept too when the stack is deleted, so a stack deleted by mistake (which
  # stops at the protected server) leaves the address on the server.
  ElasticIPAssociation:
    Type: AWS::EC2::EIPAssociation
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AllocationId: !GetAtt ElasticIP.AllocationId
      InstanceId: !Ref Instance

Outputs:
  SiteURL:
    Description: >-
      Open this right away to watch setup progress; it turns into your Plone site when it's ready
      (about 10 minutes). Log in as "admin" with the password you chose.
    Value: !If
      - HasDomain
      - !Sub "http://${Domain}"
      - !Sub "http://${ElasticIP.PublicIp}"
  PublicIP:
    Description: The server's fixed public IP address. Point your domain's DNS here.
    Value: !GetAtt ElasticIP.PublicIp
  InstanceConnect:
    Description: >-
      Forgot the password? Open this, click Connect, and run: sudo cat /root/plone-credentials.txt
      (or sudo plone-reset-admin-password).
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/ec2/home?region=${AWS::Region}#ConnectToInstance:instanceId=${Instance}"
  SSHCommand:
    Condition: HasKeyName
    Description: Log in to the server over SSH (needs the key pair you chose).
    Value: !Sub "ssh ubuntu@${ElasticIP.PublicIp}"
